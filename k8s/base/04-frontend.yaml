# Frontend tier: Flask web UI.
# - Talks to the backend using the Service name "http://backend:5000".
# - Exposed outside the cluster by the overlay (see the Service below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://backend:5000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Service: ClusterIP in the base. Each overlay decides how to expose it:
#   - minikube overlay: NodePort      (minikube service frontend -n demo)
#   - eks overlay:      LoadBalancer  (AWS NLB)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
