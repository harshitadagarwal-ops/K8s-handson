# Environment-neutral part of the app: namespace, backend, frontend.
# The database (MySQL) and its config/secret are NOT here:
#   - minikube overlay runs MySQL in the cluster
#   - eks overlay uses Amazon RDS (config/secret created by scripts/deploy-eks)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 03-backend.yaml
  - 04-frontend.yaml
