# Local demo: MySQL runs in the cluster (emptyDir), images are built inside
# Minikube's Docker daemon, frontend is exposed with a NodePort.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - 01-config-and-secret.yaml
  - 02-mysql.yaml
patches:
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
